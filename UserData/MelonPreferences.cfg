[FanatecSupport]
# Fanatec CSL DD / DD Pro / ClubSport Direct Drive Settings
# Topology: "Auto" (auto-detects RJ12 daisy-chain into CSL DD base or split USB pedals), "Combined", or "Split"
Topology = "Auto"
DirectDriveSafety = true
DirectDriveScale = 0.6500000
TorqueSlewRateLimit = true
MaxTorqueSlewRate = 12000.0
WatchdogTimeoutMs = 200
AntiOscillationDamping = true
LoadCellBrakeSupport = true
BrakeAxis = "Auto"
ThrottleAxis = "Auto"


[SimHubTelemetry]
# SimHub ShakeIt Bass Shakers & Tactile Telemetry UDP Broadcaster
# Emits standard Forza Motorsport 7 (Dash protocol, 311 bytes) packets to SimHub
Enable = true
TargetIP = "127.0.0.1"
TargetPort = 8000
BroadcastRateHz = 60

[ButtonBox]
# Secondary USB Button Box, QMK/VIA Macro Keypad (nullbits VID 6E61 / PID 6062) & Rotary Encoders
